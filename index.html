<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hesap Makinesi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --bg-glow: #141821;
      --panel: #151922;
      --panel-2: #1b212d;
      --key: #1e2531;
      --key-hover: #283041;
      --key-active: #323c4f;
      --line: #2a3340;
      --text: #f4f7fb;
      --muted: #8b97a8;
      --accent: #f5c518;
      --accent-soft: #f5c51822;
      --accent-press: #ffd84d;
      --operator: #ffb454;
      --danger: #ff6b6b;
      --radius: 22px;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--bg-glow), transparent 60%),
        radial-gradient(800px 500px at 90% 110%, #1a1407, transparent 55%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .calculator {
      width: min(100%, 380px);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 30px 80px -20px rgba(0,0,0,0.75);
      overflow: hidden;
    }

    .display {
      padding: 26px 24px 18px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(245,197,24,0.05), transparent);
    }

    .expression {
      min-height: 20px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result {
      min-height: 64px;
      font-size: clamp(40px, 12vw, 60px);
      font-weight: 600;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: var(--accent);
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .result::-webkit-scrollbar { display: none; }

    .result[data-error="true"] {
      color: var(--danger);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0;
      word-break: break-all;
    }

    .expression:empty { min-height: 0; margin: 0; }

    .sci {
      display: grid;
      grid-template-rows: 0fr;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
      overflow: hidden;
      opacity: 0;
      transition: grid-template-rows 240ms ease, opacity 200ms ease;
    }

    .sci > * {
      min-height: 0;
    }

    .sci[data-open="true"] {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .sci button {
      background: #181f2b;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
    }

    .sci button:hover { background: #202938; }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
    }

    button {
      appearance: none;
      border: 0;
      margin: 0;
      min-height: 68px;
      background: var(--key);
      color: var(--text);
      font: inherit;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 130ms ease, transform 80ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: var(--key-hover); }
    button:active { background: var(--key-active); transform: scale(0.97); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .equals:focus-visible,
    .sci-toggle[aria-pressed="true"]:focus-visible { outline-color: #ffffff; }

    .utility { color: var(--muted); font-weight: 600; }

    .operator {
      color: var(--text);
      font-weight: 700;
      background: linear-gradient(180deg, #232b38, var(--key));
    }
    .operator:hover { background: var(--key-hover); }

    .sci-toggle {
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
    }
    .sci-toggle:hover { background: var(--key-hover); }
    .sci-toggle[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent-press);
    }

    .equals {
      background: var(--accent);
      color: #14160a;
      font-weight: 800;
      font-size: 26px;
    }
    .equals:hover { background: var(--accent-press); }

    .zero { grid-column: span 2; }

    .hint {
      margin: 12px 4px 0;
      color: #9aa6b6;
      font-size: 11.5px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    @media (max-width: 420px) {
      button { min-height: 64px; font-size: 20px; }
      .calculator { border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="calculator" aria-label="Hesap makinesi">
      <div class="display">
        <div class="expression" data-expression aria-hidden="true"></div>
        <output class="result" data-display data-error="false" aria-live="polite">0</output>
      </div>

      <div class="sci" data-sci data-open="false">
        <button class="sci-fn" data-key="sin" aria-label="Sinüs">sin</button>
        <button class="sci-fn" data-key="cos" aria-label="Kosinüs">cos</button>
        <button class="sci-fn" data-key="tan" aria-label="Tanjant">tan</button>
        <button class="sci-fn" data-key="√" aria-label="Karekök">√</button>

        <button class="sci-fn" data-key="log" aria-label="10 tabanında logaritma">log</button>
        <button class="sci-fn" data-key="ln" aria-label="Doğal logaritma">ln</button>
        <button class="sci-fn" data-key="x^y" aria-label="Üs alma">xʸ</button>
        <button class="sci-fn" data-key="π" aria-label="Pi sayısı">π</button>

        <button class="sci-fn" data-key="e" aria-label="Euler sayısı">e</button>
        <button class="sci-fn" data-key="%" aria-label="Yüzde">%</button>
        <button class="sci-fn" data-key="±" aria-label="İşaret değiştir">±</button>
        <button class="sci-toggle" data-key="SCI" aria-label="Bilimsel modu kapat" aria-pressed="true">SCI✕</button>
      </div>

      <div class="keys" data-keys>
        <button class="sci-toggle" data-key="SCI" aria-label="Bilimsel modu aç" aria-pressed="false">SCI</button>
        <button class="utility" data-key="C" aria-label="Temizle">C</button>
        <button class="utility" data-key="⌫" aria-label="Son basamağı sil">⌫</button>
        <button class="operator" data-key="÷" aria-label="Böl">÷</button>

        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="operator" data-key="×" aria-label="Çarp">×</button>

        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button class="operator" data-key="-" aria-label="Çıkar">−</button>

        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button class="operator" data-key="+" aria-label="Topla">+</button>

        <button class="zero" data-key="0">0</button>
        <button data-key="." aria-label="Ondalık ayırıcı">.</button>
        <button class="equals" data-key="=" aria-label="Sonucu göster">=</button>
      </div>
    </section>
    <p class="hint">Klavye desteklenir · Esc temizler · SCI bilimsel mod</p>
  </main>
  <script src="./calculator.js"></script>
</body>
</html>
