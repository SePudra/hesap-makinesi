<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hesap Makinesi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #11100e;
      color: #f4f0e8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: #11100e;
      background-image: radial-gradient(#2e2b26 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    main {
      width: min(100%, 360px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #9b958a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .calculator {
      overflow: hidden;
      border: 1px solid #39352f;
      border-radius: 24px;
      background: #1b1916;
      box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
    }

    .display {
      min-height: 128px;
      display: flex;
      align-items: end;
      justify-content: end;
      overflow: hidden;
      padding: 28px 24px 22px;
      border-bottom: 1px solid #39352f;
      font-size: clamp(42px, 13vw, 62px);
      font-weight: 520;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .display[data-error="true"] {
      color: #ff9b88;
      font-size: 25px;
      letter-spacing: -0.02em;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #39352f;
    }

    button {
      min-height: 70px;
      border: 0;
      background: #211f1b;
      color: inherit;
      font: inherit;
      font-size: 21px;
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease;
    }

    button:hover { background: #2a2722; }
    button:active { background: #332f29; }
    button:focus-visible { outline: 3px solid #f2b84b; outline-offset: -4px; }

    .utility { color: #b9b1a4; }
    .operator { color: #f2b84b; font-weight: 700; }
    .equals { grid-row: span 2; background: #f2b84b; color: #18130a; font-weight: 800; }
    .equals:hover { background: #ffc75c; }
    .zero { grid-column: span 2; }

    .hint {
      margin: 14px 2px 0;
      color: #777168;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .calculator { border-radius: 20px; }
      button { min-height: 66px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Hermes deneme projesi</p>
    <section class="calculator" aria-label="Hesap makinesi">
      <output class="display" data-display data-error="false" aria-live="polite">0</output>
      <div class="keys" data-keys>
        <button class="utility" data-key="C" aria-label="Temizle">C</button>
        <button class="utility" data-key="⌫" aria-label="Son basamağı sil">←</button>
        <button class="operator" data-key="÷" aria-label="Böl">÷</button>
        <button class="operator" data-key="×" aria-label="Çarp">×</button>

        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="operator" data-key="-" aria-label="Çıkar">−</button>

        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button class="operator" data-key="+" aria-label="Topla">+</button>

        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button class="equals" data-key="=" aria-label="Sonucu göster">=</button>

        <button class="zero" data-key="0">0</button>
        <button data-key="." aria-label="Ondalık ayırıcı">.</button>
      </div>
    </section>
    <p class="hint">Klavye desteklenir · Esc temizler</p>
  </main>
  <script src="./calculator.js"></script>
</body>
</html>
