<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hesap Makinesi</title>
  <style>
    /* DIRECTION CONTRACT — impeccable new-work
       THESIS: A cathode instrument — every value present at once as a dark ghost behind a fine
       bronze anode gauze, the live result struck forward in glowing cathode orange. Refuses the
       card-grid and gradient-text defaults of category calculators.
       OWN-WORLD: ink-blue black ground, bronze wire gauze texture, ghost/solid numeral layers,
       one cathode-orange glow for the active value; monospace tabular numerals.
       STORY: The visitor reads a precise instrument; the screen shows the entered expression as
       ghost numerals and the result blazing in orange, exactly like a bench counter at 2am.
       FIRST VIEWPORT: centered instrument panel; ghost expression row above, large glowing result
       below; key grid wrapped in the same bronze-gauze field; SCI reveals a second instrument layer.
       FORM: cathode numeral stack (challenger c037784c-4), fused with creator-hardware bench
       tactile key travel. Seed key c037784c.
       FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
       the verdict, DESIGN.md, and every shipping raster carrying its provenance. */
    :root {
      color-scheme: dark;
      --ground: #070b12;
      --ground-2: #0b121d;
      --gauze: #2a2113;
      --bronze: #8a6a3a;
      --ghost: #1c2a3d;
      --ghost-text: #35506e;
      --ink: #c7d4e2;
      --cathode: #ff7a18;
      --cathode-soft: #ff7a1822;
      --cathode-glow: 0 0 12px #ff7a22aa, 0 0 28px #ff7a2233;
      --operator: #6fb3ff;
      --line: #16202e;
      --font: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at 50% -15%, #111a28, transparent 60%),
        var(--ground);
      -webkit-font-smoothing: antialiased;
    }

    .calculator {
      width: min(100%, 380px);
      border: 1px solid var(--gauze);
      border-radius: 18px;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, #ffffff05 3px 4px),
        linear-gradient(180deg, var(--ground-2), var(--ground));
      box-shadow:
        0 1px 0 #ffffff0a inset,
        0 30px 80px -24px #000000cc;
      overflow: hidden;
      position: relative;
    }

    /* bronze anode gauze veil */
    .calculator::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(90deg, #00000000 0 22px, #8a6a3a14 22px 23px),
        repeating-linear-gradient(0deg, #00000000 0 22px, #8a6a3a14 22px 23px);
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    .display {
      padding: 28px 22px 20px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    .expression {
      min-height: 22px;
      margin-bottom: 8px;
      color: var(--ghost-text);
      font-size: 15px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .expression:empty { min-height: 0; margin: 0; }

    .result {
      min-height: 66px;
      font-size: clamp(38px, 11vw, 56px);
      font-weight: 500;
      line-height: 1.02;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--cathode);
      text-shadow: var(--cathode-glow);
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .result::-webkit-scrollbar { display: none; }
    .result[data-error="true"] {
      color: #ff5a5a;
      text-shadow: 0 0 12px #ff5a5a55;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 0;
      word-break: break-all;
    }

    .sci {
      display: grid;
      grid-template-rows: 0fr;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
      overflow: hidden;
      opacity: 0;
      transition: grid-template-rows 240ms ease, opacity 200ms ease;
      position: relative;
      z-index: 1;
    }
    .sci > * { min-height: 0; }
    .sci[data-open="true"] { grid-template-rows: 1fr; opacity: 1; }

    .sci button {
      background: #0a121d;
      color: var(--ghost-text);
      font-size: 15px;
      font-weight: 500;
    }
    .sci button:hover { background: #11202f; }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
      position: relative;
      z-index: 1;
    }

    button {
      appearance: none;
      border: 0;
      margin: 0;
      min-height: 68px;
      background: #0c141f;
      color: var(--ink);
      font: inherit;
      font-size: 21px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 120ms ease, transform 70ms ease, box-shadow 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #121e2c; }
    button:active {
      background: #16283a;
      transform: translateY(2px);
      box-shadow: 0 -2px 0 #00000066 inset;
    }
    button:focus-visible { outline: 2px solid var(--cathode); outline-offset: -2px; }

    .utility { color: var(--ghost-text); font-weight: 500; }

    .operator {
      color: var(--operator);
      font-weight: 600;
      background: linear-gradient(180deg, #0e1a28, #0c141f);
    }
    .operator:hover { background: #142436; }

    .sci-toggle {
      color: var(--bronze);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.06em;
    }
    .sci-toggle:hover { background: #121e2c; }
    .sci-toggle[aria-pressed="true"] {
      background: var(--cathode-soft);
      color: var(--cathode);
    }

    .equals {
      background: var(--cathode);
      color: #1a0d02;
      font-weight: 700;
      font-size: 25px;
      text-shadow: none;
      box-shadow: 0 0 14px #ff7a2244;
    }
    .equals:hover { background: #ff8c33; }

    .zero { grid-column: span 2; }

    .hint {
      margin: 12px 4px 0;
      color: #5a6b7e;
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.04em;
    }

    @media (max-width: 420px) {
      button { min-height: 64px; font-size: 19px; }
      .calculator { border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="calculator" aria-label="Hesap makinesi">
      <div class="display">
        <div class="expression" data-expression aria-hidden="true"></div>
        <output class="result" data-display data-error="false" aria-live="polite">0</output>
      </div>

      <div class="sci" data-sci data-open="false">
        <button class="sci-fn" data-key="sin" aria-label="Sinüs">sin</button>
        <button class="sci-fn" data-key="cos" aria-label="Kosinüs">cos</button>
        <button class="sci-fn" data-key="tan" aria-label="Tanjant">tan</button>
        <button class="sci-fn" data-key="√" aria-label="Karekök">√</button>

        <button class="sci-fn" data-key="log" aria-label="10 tabanında logaritma">log</button>
        <button class="sci-fn" data-key="ln" aria-label="Doğal logaritma">ln</button>
        <button class="sci-fn" data-key="x^y" aria-label="Üs alma">xʸ</button>
        <button class="sci-fn" data-key="π" aria-label="Pi sayısı">π</button>

        <button class="sci-fn" data-key="e" aria-label="Euler sayısı">e</button>
        <button class="sci-fn" data-key="%" aria-label="Yüzde">%</button>
        <button class="sci-fn" data-key="±" aria-label="İşaret değiştir">±</button>
        <button class="sci-toggle" data-key="SCI" aria-label="Bilimsel modu kapat" aria-pressed="true">SCI✕</button>
      </div>

      <div class="keys" data-keys>
        <button class="sci-toggle" data-key="SCI" aria-label="Bilimsel modu aç" aria-pressed="false">SCI</button>
        <button class="utility" data-key="C" aria-label="Temizle">C</button>
        <button class="utility" data-key="⌫" aria-label="Son basamağı sil">⌫</button>
        <button class="operator" data-key="÷" aria-label="Böl">÷</button>

        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="operator" data-key="×" aria-label="Çarp">×</button>

        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button class="operator" data-key="-" aria-label="Çıkar">−</button>

        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button class="operator" data-key="+" aria-label="Topla">+</button>

        <button class="zero" data-key="0">0</button>
        <button data-key="." aria-label="Ondalık ayırıcı">.</button>
        <button class="equals" data-key="=" aria-label="Sonucu göster">=</button>
      </div>
    </section>
    <p class="hint">KLAVYE AKTİF · ESC TEMİZLER · SCI BİLİMSEL MOD</p>
  </main>
  <script src="./calculator.js"></script>
</body>
</html>
